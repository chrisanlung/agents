org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable Kotlin incremental compilation. The Kotlin RelocatableFileToPathConverter
# crashes when the Flutter pub cache (C:\Users\dseve\AppData\Local\Pub\Cache) and
# the Android project (F:\Projects\lusthing) live on different drives — it cannot
# compute a relative path across drives. Disabling incremental rebuilds the
# affected plugins from scratch each time, slightly slower but reliable.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
